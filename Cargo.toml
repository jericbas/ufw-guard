[package]
name = "ufw-guard"
version = "0.5.0"
edition = "2021"
authors = ["Jeric Bas <jeric.codes@proton.me>"]
description = "Compiled Rust governance wrapper for UFW enforcing audit comments on firewall rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jericbas/ufw-guard"
readme = "README.md"
keywords = ["ufw", "firewall", "security", "governance"]
categories = ["command-line-utilities", "security"]

[lib]
name = "ufw_guard"
path = "src/lib.rs"

[[bin]]
name = "ufw"
path = "src/main.rs"

[dependencies]
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "ufw-guard"
maintainer = "Jeric Bas <jeric.codes@proton.me>"
copyright = "2026, Jeric Bas"
license-file = ["LICENSE-MIT", "4"]
depends = "ufw (>= 0.35)"
section = "admin"
priority = "optional"
assets = [
    ["target/release/ufw", "usr/local/sbin/ufw", "755"],
    ["man/ufw-guard.8", "usr/share/man/man8/ufw-guard.8", "644"],
    ["completions/bash/ufw", "usr/share/ufw-guard/completions/bash/ufw", "644"],
    ["completions/zsh/_ufw", "usr/share/ufw-guard/completions/zsh/_ufw", "644"],
    ["completions/fish/ufw.fish", "usr/share/ufw-guard/completions/fish/ufw.fish", "644"],
]

[package.metadata.generate-rpm]
name = "ufw-guard"
summary = "Compiled Rust governance wrapper for UFW"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/ufw", dest = "/usr/local/sbin/ufw", mode = "755" },
    { source = "man/ufw-guard.8", dest = "/usr/share/man/man8/ufw-guard.8", mode = "644" },
    { source = "completions/bash/ufw", dest = "/usr/share/ufw-guard/completions/bash/ufw", mode = "644" },
    { source = "completions/zsh/_ufw", dest = "/usr/share/ufw-guard/completions/zsh/_ufw", mode = "644" },
    { source = "completions/fish/ufw.fish", dest = "/usr/share/ufw-guard/completions/fish/ufw.fish", mode = "644" },
]

[package.metadata.generate-rpm.requires]
ufw = ">= 0.35"
