[package]
name = "ufw-guard"
version = "0.2.0"
edition = "2021"
authors = ["Jeric Bas <jericrayebas@gmail.com>"]
description = "Compiled Rust governance wrapper for UFW enforcing audit comments on firewall rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jericbas/ufw-guard"
readme = "README.md"
keywords = ["ufw", "firewall", "security", "governance"]
categories = ["command-line-utilities", "security"]

[lib]
name = "ufw_guard"
path = "src/lib.rs"

[[bin]]
name = "ufw"
path = "src/main.rs"

[dependencies]
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "ufw-guard"
maintainer = "Jeric Bas <jericrayebas@gmail.com>"
copyright = "2026, Jeric Bas"
license-file = ["LICENSE-MIT", "4"]
depends = "ufw (>= 0.35)"
section = "admin"
priority = "optional"
assets = [
    ["target/release/ufw", "usr/local/sbin/ufw", "755"],
]

[package.metadata.generate-rpm]
name = "ufw-guard"
summary = "Compiled Rust governance wrapper for UFW"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/ufw", dest = "/usr/local/sbin/ufw", mode = "755" },
]

[package.metadata.generate-rpm.requires]
ufw = ">= 0.35"
